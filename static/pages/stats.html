<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <title>数据统计 - Shuttle Score</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .page-header {
            margin-bottom: 20px;
        }
        .page-title {
            font-family: var(--font-title);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        .page-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .chart-section {
            background: var(--white);
            border-radius: var(--radius-card);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .chart-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .chart-section-title {
            font-family: var(--font-title);
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .chart-filters {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .filter-group {
            display: flex;
            gap: 4px;
        }
        .info-tip {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1.5px solid var(--text-muted);
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            cursor: help;
            flex-shrink: 0;
        }
        .info-tip:hover .info-tooltip,
        .info-tip:focus .info-tooltip {
            display: block;
        }
        .info-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--white);
            font-size: 12px;
            font-weight: 400;
            line-height: 1.5;
            padding: 8px 12px;
            border-radius: 6px;
            white-space: nowrap;
            z-index: 100;
            pointer-events: none;
        }
        .info-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--text-primary);
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
        }
        .chart-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .chart-empty-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .chart-empty-text {
            font-size: 14px;
        }
        @media (max-width: 767px) {
            .chart-filters {
                gap: 10px;
            }
            .filter-item {
                flex-wrap: wrap;
            }
            .info-tooltip {
                white-space: normal;
                min-width: 200px;
            }
        }
    </style>
</head>
<body>
    <nav id="nav-bar" class="nav-bar"></nav>

    <div class="container">
        <div class="page-header">
            <div class="page-title">数据统计</div>
            <div class="page-subtitle">个人</div>
        </div>

        <div class="chart-section" id="opponent-section">
            <div class="chart-section-header">
                <div class="chart-section-title">对战胜率</div>
            </div>
            <div class="chart-filters" id="opponent-filters">
                <div class="filter-item">
                    <span class="filter-label">时间</span>
                    <div class="filter-group" data-chart="opponent" data-filter="time">
                        <button class="stats-tab active" data-value="30d">近30天</button>
                        <button class="stats-tab" data-value="all">永久</button>
                    </div>
                </div>
                <div class="filter-item">
                    <span class="filter-label">类型</span>
                    <div class="filter-group" data-chart="opponent" data-filter="type">
                        <button class="filter-chip active" data-value="all">所有</button>
                        <button class="filter-chip" data-value="singles">单打</button>
                        <button class="filter-chip" data-value="doubles">双打</button>
                    </div>
                </div>
                <div class="filter-item">
                    <span class="filter-label">比赛</span>
                    <div class="filter-group" data-chart="opponent" data-filter="formal">
                        <button class="filter-chip active" data-value="include_unlimited">全部</button>
                        <button class="filter-chip" data-value="formal_only">正式比赛</button>
                    </div>
                    <span class="info-tip" tabindex="0">!
                        <span class="info-tooltip">正式比赛：男单、女单、男双、女双、混双（有性别限制）</span>
                    </span>
                </div>
            </div>
            <div class="chart-wrapper" id="opponent-chart-wrapper">
                <canvas id="opponent-chart"></canvas>
            </div>
            <div class="chart-empty" id="opponent-empty" style="display:none;">
                <div class="chart-empty-icon">--</div>
                <div class="chart-empty-text">暂无对战胜率数据</div>
            </div>
        </div>

        <div class="chart-section" id="partner-section">
            <div class="chart-section-header">
                <div class="chart-section-title">搭档胜率</div>
            </div>
            <div class="chart-filters" id="partner-filters">
                <div class="filter-item">
                    <span class="filter-label">时间</span>
                    <div class="filter-group" data-chart="partner" data-filter="time">
                        <button class="stats-tab active" data-value="30d">近30天</button>
                        <button class="stats-tab" data-value="all">永久</button>
                    </div>
                </div>
                <div class="filter-item">
                    <span class="filter-label">类型</span>
                    <div class="filter-group" data-chart="partner" data-filter="type">
                        <button class="filter-chip active" data-value="all">所有</button>
                        <button class="filter-chip" data-value="singles">单打</button>
                        <button class="filter-chip" data-value="doubles">双打</button>
                    </div>
                </div>
                <div class="filter-item">
                    <span class="filter-label">比赛</span>
                    <div class="filter-group" data-chart="partner" data-filter="formal">
                        <button class="filter-chip active" data-value="include_unlimited">全部</button>
                        <button class="filter-chip" data-value="formal_only">正式比赛</button>
                    </div>
                    <span class="info-tip" tabindex="0">!
                        <span class="info-tooltip">正式比赛：男单、女单、男双、女双、混双（有性别限制）</span>
                    </span>
                </div>
            </div>
            <div class="chart-wrapper" id="partner-chart-wrapper">
                <canvas id="partner-chart"></canvas>
            </div>
            <div class="chart-empty" id="partner-empty" style="display:none;">
                <div class="chart-empty-icon">--</div>
                <div class="chart-empty-text">暂无搭档胜率数据</div>
            </div>
        </div>
    </div>

    <div id="tab-bar" class="tab-bar"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/stats.js"></script>
    <script>
        if (!ShuttleAuth.requireLogin()) throw new Error('Not logged in');
        ShuttleNav.renderAll('stats');
        ShuttleStats.init();
    </script>
</body>
</html>
