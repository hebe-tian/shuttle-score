<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <title>我的 - Shuttle Score</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <nav id="nav-bar" class="nav-bar"></nav>

    <div class="container">
        <div id="welcome-section" class="card" style="margin-bottom:16px;">
            <h2 style="font-family:var(--font-title);color:var(--primary-darker);margin-bottom:4px;">Welcome</h2>
            <p style="color:var(--text-secondary);font-size:14px;" id="welcome-text"></p>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h3 style="font-family:var(--font-title);color:var(--primary-darker);">近期比赛</h3>
            <div style="display:flex;gap:8px;align-items:center;">
                <a href="/pages/match-query.html" id="more-matches-link" style="font-size:13px;color:var(--primary);text-decoration:none;">更多</a>
                <a href="/pages/matches.html" class="btn btn-primary btn-sm">录入比赛</a>
            </div>
        </div>

        <div id="recent-matches"></div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;margin-top:24px;">
            <h3 style="font-family:var(--font-title);color:var(--primary-darker);">选手列表</h3>
            <button id="open-add-player" class="btn btn-primary btn-sm">录入选手</button>
        </div>

        <div class="filter-bar">
            <button class="filter-chip gender-chip active" data-gender="">全部</button>
            <button class="filter-chip gender-chip" data-gender="male">男</button>
            <button class="filter-chip gender-chip" data-gender="female">女</button>
        </div>

        <div id="player-list"></div>
        <div id="player-expand" style="text-align:center;margin-top:8px;display:none;">
            <button id="expand-players-btn" class="btn btn-outline btn-sm">展开更多</button>
        </div>
    </div>

    <!-- 录入选手弹窗 -->
    <div id="add-player-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-title">录入选手</div>
            <form id="add-player-form">
                <div class="form-group">
                    <label class="form-label">选手名称</label>
                    <input type="text" id="player-name" class="form-input" placeholder="2-20位" required>
                </div>
                <div class="form-group">
                    <label class="form-label">性别</label>
                    <select id="player-gender" class="form-select" required>
                        <option value="">请选择</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" id="close-add-player" class="btn btn-outline btn-sm">取消</button>
                    <button type="submit" class="btn btn-primary btn-sm">添加</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 编辑选手弹窗 -->
    <div id="edit-player-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-title">编辑选手</div>
            <form id="edit-player-form">
                <div class="form-group">
                    <label class="form-label">选手名称</label>
                    <input type="text" id="edit-player-name" class="form-input" placeholder="留空则不修改">
                </div>
                <div class="form-group">
                    <label class="form-label">绑定用户ID（可选）</label>
                    <input type="text" id="edit-player-user-id" class="form-input" placeholder="输入用户ID建立绑定">
                </div>
                <div id="edit-player-error" class="form-error"></div>
                <div class="modal-actions">
                    <button type="button" id="close-edit-player" class="btn btn-outline btn-sm">取消</button>
                    <button type="submit" class="btn btn-primary btn-sm">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="delete-player-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-title">确认删除</div>
            <p style="font-size:14px;color:var(--text-secondary);line-height:1.6;">删除后无法撤销，该选手已录入的成绩不会被删除。</p>
            <div class="modal-actions">
                <button type="button" id="close-delete-player" class="btn btn-outline btn-sm">取消</button>
                <button type="button" id="confirm-delete-player" class="btn btn-danger btn-sm">确认删除</button>
            </div>
        </div>
    </div>

    <!-- 绑定弹窗 -->
    <div id="bind-player-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-title">绑定用户</div>

            <div class="form-group">
                <label class="form-label">方式一：邀请注册</label>
                <button type="button" id="generate-invite-btn" class="btn btn-outline btn-sm">生成邀请链接</button>
                <div id="invite-link-area" style="display:none;margin-top:8px;">
                    <div style="display:flex;gap:8px;align-items:center;">
                        <span id="invite-link-text" style="font-size:12px;color:var(--primary);word-break:break-all;flex:1;"></span>
                        <button type="button" id="copy-invite-link" class="btn btn-outline btn-sm">复制</button>
                    </div>
                    <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">链接24小时内有效</p>
                </div>
            </div>

            <div style="border-top:1px solid var(--border);margin:16px 0;"></div>

            <div class="form-group">
                <label class="form-label">方式二：输入用户ID</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="bind-user-id-input" class="form-input" placeholder="输入用户ID" style="flex:1;">
                    <button type="button" id="bind-user-id-submit" class="btn btn-primary btn-sm">绑定</button>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" id="close-bind-player" class="btn btn-outline btn-sm">关闭</button>
            </div>
        </div>
    </div>

    <!-- 绑定用户信息弹窗 -->
    <div id="bind-user-info-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-title">绑定用户信息</div>
            <div class="form-group">
                <label class="form-label">用户名</label>
                <p id="bind-user-info-username" style="font-size:14px;color:var(--text-primary);"></p>
            </div>
            <div class="form-group">
                <label class="form-label">账号</label>
                <p id="bind-user-info-account" style="font-size:14px;color:var(--text-primary);"></p>
            </div>
            <div class="modal-actions">
                <button type="button" id="unbind-user-btn" class="btn btn-danger btn-sm">解绑</button>
                <button type="button" id="close-bind-user-info" class="btn btn-outline btn-sm">关闭</button>
            </div>
        </div>
    </div>

    <div id="tab-bar" class="tab-bar"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/players.js"></script>
    <script src="/js/matches.js"></script>
    <script>
        if (!ShuttleAuth.requireLogin()) throw new Error('Not logged in');

        ShuttleNav.renderAll('home');

        const user = ShuttleAuth.getUser();
        if (user) {
            document.getElementById('welcome-text').textContent = user.username;
        }

        async function loadRecentMatches() {
            const res = await ShuttleAPI.matches.query({ page: 1, page_size: 5 });
            const container = document.getElementById('recent-matches');
            if (res.ok && res.data && res.data.items && res.data.items.length > 0) {
                container.innerHTML = res.data.items.map(m => ShuttleNav.renderMatchCard(m)).join('');
            } else {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-text">还没有比赛记录</div></div>';
            }
        }

        loadRecentMatches();

        const PLAYER_PAGE_SIZE = 10;
        let playerExpanded = false;

        const origLoadPlayers = ShuttlePlayers.loadPlayers.bind(ShuttlePlayers);
        ShuttlePlayers.loadPlayers = async function(gender) {
            this.currentGender = gender || '';
            const res = await ShuttleAPI.players.list(this.currentGender);
            if (res.ok) {
                const allPlayers = res.data || [];
                if (!playerExpanded && allPlayers.length > PLAYER_PAGE_SIZE) {
                    this.renderPlayerList(allPlayers.slice(0, PLAYER_PAGE_SIZE));
                    document.getElementById('player-expand').style.display = 'block';
                } else {
                    this.renderPlayerList(allPlayers);
                    document.getElementById('player-expand').style.display = 'none';
                }
            }
            return res;
        };

        document.getElementById('expand-players-btn')?.addEventListener('click', () => {
            playerExpanded = true;
            ShuttlePlayers.loadPlayers(ShuttlePlayers.currentGender);
        });

        ShuttlePlayers.init();
    </script>
</body>
</html>
