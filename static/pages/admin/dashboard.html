<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <title>管理后台 - Shuttle Score</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-brand">管理后台</div>
            <a href="/pages/admin/dashboard.html" class="admin-nav-item active">仪表盘</a>
            <a href="/pages/admin/admins.html" class="admin-nav-item">管理员管理</a>
            <a href="/pages/admin/users.html" class="admin-nav-item">用户管理</a>
            <a href="/pages/admin/matches.html" class="admin-nav-item">比赛管理</a>
            <a href="/pages/admin/players.html" class="admin-nav-item">选手管理</a>
            <a href="/pages/admin/teams.html" class="admin-nav-item">团队管理</a>
            <a href="/pages/admin/settings.html" class="admin-nav-item">系统设置</a>
            <a href="/pages/admin/login.html" class="admin-nav-item" onclick="ShuttleAuth.adminLogout()" style="color:var(--error);">退出登录</a>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1 class="admin-title">仪表盘</h1>
                <span id="admin-name" style="font-size:13px;color:var(--text-secondary);"></span>
            </div>

            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px;">
                <div class="card" style="text-align:center;">
                    <div style="font-size:28px;font-weight:700;color:var(--primary);" id="stat-users">0</div>
                    <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">用户数</div>
                </div>
                <div class="card" style="text-align:center;">
                    <div style="font-size:28px;font-weight:700;color:var(--match-ms);" id="stat-matches">0</div>
                    <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">比赛数</div>
                </div>
                <div class="card" style="text-align:center;">
                    <div style="font-size:28px;font-weight:700;color:var(--match-xd);" id="stat-players">0</div>
                    <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">选手数</div>
                </div>
                <div class="card" style="text-align:center;">
                    <div style="font-size:28px;font-weight:700;color:var(--match-od);" id="stat-admins">0</div>
                    <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">管理员数</div>
                </div>
                <div class="card" style="text-align:center;">
                    <div style="font-size:28px;font-weight:700;color:var(--match-os);" id="stat-teams">0</div>
                    <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">团队数</div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        if (!ShuttleAuth.requireAdmin()) throw new Error('Not admin');

        const admin = ShuttleAuth.getAdmin();
        if (admin) {
            document.getElementById('admin-name').textContent = admin.account;
        }

        ShuttleAdmin.loadDashboard();
    </script>
</body>
</html>
