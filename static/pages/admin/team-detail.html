<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <title>团队详情 - Shuttle Score</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-brand">管理后台</div>
            <a href="/pages/admin/dashboard.html" class="admin-nav-item">仪表盘</a>
            <a href="/pages/admin/admins.html" class="admin-nav-item">管理员管理</a>
            <a href="/pages/admin/users.html" class="admin-nav-item">用户管理</a>
            <a href="/pages/admin/matches.html" class="admin-nav-item">比赛管理</a>
            <a href="/pages/admin/players.html" class="admin-nav-item">选手管理</a>
            <a href="/pages/admin/teams.html" class="admin-nav-item active">团队管理</a>
            <a href="/pages/admin/settings.html" class="admin-nav-item">系统设置</a>
            <a href="/pages/admin/login.html" class="admin-nav-item" onclick="ShuttleAuth.adminLogout()" style="color:var(--error);">退出登录</a>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1 class="admin-title">团队详情</h1>
                <a href="/pages/admin/teams.html" class="btn btn-secondary btn-sm">返回列表</a>
            </div>

            <div id="team-info"></div>

            <h3 style="margin:16px 0 8px;">成员列表</h3>
            <div id="member-list"></div>

            <h3 style="margin:16px 0 8px;">选手列表</h3>
            <div id="player-list"></div>

            <div style="margin-top:24px;">
                <button id="delete-team-btn" class="btn btn-danger" onclick="ShuttleAdmin.confirmDeleteTeam()">解散团队</button>
            </div>
        </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        if (!ShuttleAuth.requireAdmin()) throw new Error('Not admin');

        const params = new URLSearchParams(window.location.search);
        const teamId = params.get('id');
        ShuttleAdmin.loadTeamDetail(teamId);
    </script>
</body>
</html>
