<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <title>比赛管理 - Shuttle Score</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-brand">管理后台</div>
            <a href="/pages/admin/dashboard.html" class="admin-nav-item">仪表盘</a>
            <a href="/pages/admin/admins.html" class="admin-nav-item">管理员管理</a>
            <a href="/pages/admin/users.html" class="admin-nav-item">用户管理</a>
            <a href="/pages/admin/matches.html" class="admin-nav-item active">比赛管理</a>
            <a href="/pages/admin/players.html" class="admin-nav-item">选手管理</a>
            <a href="/pages/admin/login.html" class="admin-nav-item" onclick="ShuttleAuth.adminLogout()" style="color:var(--error);">退出登录</a>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1 class="admin-title">比赛管理</h1>
            </div>

            <div class="card" style="margin-bottom:16px;">
                <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">比赛类型</label>
                        <select id="admin-match-type" class="form-select" style="width:auto;">
                            <option value="">全部</option>
                            <option value="ms">男单</option>
                            <option value="ws">女单</option>
                            <option value="os">无限制单打</option>
                            <option value="md">男双</option>
                            <option value="wd">女双</option>
                            <option value="xd">混双</option>
                            <option value="od">无限制双打</option>
                        </select>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="ShuttleAdmin.loadMatches(1)">筛选</button>
                </div>
            </div>

            <div id="admin-match-list"></div>
            <div id="admin-match-pagination" class="pagination"></div>
        </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        if (!ShuttleAuth.requireAdmin()) throw new Error('Not admin');

        ShuttleAdmin.loadMatches(1);
    </script>
</body>
</html>
