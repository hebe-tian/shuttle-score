<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <title>系统设置 - Shuttle Score</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-brand">管理后台</div>
            <a href="/pages/admin/dashboard.html" class="admin-nav-item">仪表盘</a>
            <a href="/pages/admin/admins.html" class="admin-nav-item">管理员管理</a>
            <a href="/pages/admin/users.html" class="admin-nav-item">用户管理</a>
            <a href="/pages/admin/matches.html" class="admin-nav-item">比赛管理</a>
            <a href="/pages/admin/players.html" class="admin-nav-item">选手管理</a>
            <a href="/pages/admin/settings.html" class="admin-nav-item active">系统设置</a>
            <a href="/pages/admin/login.html" class="admin-nav-item" onclick="ShuttleAuth.adminLogout()" style="color:var(--error);">退出登录</a>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1 class="admin-title">系统设置</h1>
            </div>

            <div class="card">
                <div class="form-group">
                    <label class="form-label">GitHub Issue 链接</label>
                    <input type="url" id="setting-github-url" class="form-input" placeholder="https://github.com/your-repo/issues">
                    <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">首页联系方式中展示的 GitHub Issue 页面链接</div>
                </div>
                <div class="form-group">
                    <label class="form-label">联系邮箱</label>
                    <input type="email" id="setting-contact-email" class="form-input" placeholder="your-email@example.com">
                    <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">首页联系方式中展示的邮箱地址</div>
                </div>
                <button class="btn btn-primary" onclick="ShuttleAdmin.saveSettings()">保存设置</button>
            </div>
        </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        if (!ShuttleAuth.requireAdmin()) throw new Error('Not admin');

        ShuttleAdmin.loadSettings();
    </script>
</body>
</html>
