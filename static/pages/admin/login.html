<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <title>管理员登录 - Shuttle Score</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="auth-card">
        <div class="auth-title">管理员登录</div>
        <form id="admin-login-form">
            <div class="form-group">
                <label class="form-label">账号</label>
                <input type="text" id="admin-account" class="form-input" placeholder="管理员账号" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" id="admin-password" class="form-input" placeholder="管理员密码" autocomplete="current-password" required>
            </div>
            <div id="admin-login-error" class="form-error" style="margin-bottom:12px;"></div>
            <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
        <div class="auth-footer">
            <a href="/">返回首页</a>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        if (ShuttleAuth.isAdminLoggedIn()) {
            window.location.href = '/pages/admin/dashboard.html';
        }

        document.getElementById('admin-login-form').addEventListener('submit', (e) => {
            ShuttleAdmin.handleAdminLogin(e);
        });
    </script>
</body>
</html>
